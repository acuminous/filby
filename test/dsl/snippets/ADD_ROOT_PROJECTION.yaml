- operation: ADD_PROJECTION
  name: VAT Rates
  version: 1
  root: VAT Rate@1
  parameters:
    type:
      field: type
    prefix:
      field: type
      match: prefix
    types:
      field: type
      match: in
    rate:
      field: rate
      match: range
    above:
      field: rate
      match: gt
    at_least:
      field: rate
      match: gte
    below:
      field: rate
      match: lt
    at_most:
      field: rate
      match: lte
  order:
    - field: rate
  paging:
    page_size: 2
    page_max: 3
