- operation: ADD_ENTITY
  name: park
  version: 1
  fields:
    code: TEXT
    name: TEXT
  key:
    - code

- operation: ADD_ENTITY
  name: season
  version: 1
  fields:
    park_code: TEXT
    type: TEXT
    start: TIMESTAMP WITH TIME ZONE
    end: TIMESTAMP WITH TIME ZONE
  key:
    - park_code
    - type
    - start

- operation: ADD_ENTITY
  name: rate
  version: 1
  fields:
    park_code: TEXT
    season_type: TEXT
    band: TEXT
    amount: NUMERIC(10,2)
  key:
    - park_code
    - season_type
    - band
