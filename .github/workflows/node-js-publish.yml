name: Node.js Publish

on:
  release:
    types: [created]

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      workspace: ${{ steps.tag.outputs.workspace }}
    steps:
      - uses: actions/checkout@v7
      - id: tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          case "$TAG" in
            framework-v*) workspace=framework ;;
            ui-v*) workspace=ui ;;
            *) echo "::error::Tag $TAG does not start with framework-v or ui-v" && exit 1 ;;
          esac
          version=$(node -p "require('./$workspace/package.json').version")
          if [ "${TAG#*-v}" != "$version" ]; then
            echo "::error::Tag $TAG does not match version $version in $workspace/package.json" && exit 1
          fi
          echo "workspace=$workspace" >> "$GITHUB_OUTPUT"

  test-framework:
    needs: resolve
    if: needs.resolve.outputs.workspace == 'framework'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: fby_test
          POSTGRES_USER: fby_test
          POSTGRES_PASSWORD: fby_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
      - run: npm ci
      - run: npm test --workspace framework

  test-ui:
    needs: resolve
    if: needs.resolve.outputs.workspace == 'ui'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
      - run: npm ci
      - run: npm test --workspace ui

  publish-npm:
    needs: [resolve, test-framework, test-ui]
    if: ${{ !cancelled() && needs.resolve.result == 'success' && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          registry-url: https://registry.npmjs.org/
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm publish --workspace ${{ needs.resolve.outputs.workspace }}
