# yaml-language-server: $schema=https://acuminous.github.io/filby/lib/schema.json
- operation: ADD_CHANGE_SET
  description: 2027 catalogue and price list
  effective: 2027-01-01T00:00:00Z
  changes:
    - entity: Model@1
      action: SET
      source: ./csv/catalogue-2027/model.csv
    - entity: Grade Model@1
      action: SET
      source: ./csv/catalogue-2027/grade-model.csv
    - entity: Price@1
      action: SET
      source: ./csv/catalogue-2027/price.csv
    - entity: Accessory@1
      action: SET
      source: ./csv/catalogue-2027/accessory.csv
