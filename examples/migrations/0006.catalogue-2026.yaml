# yaml-language-server: $schema=https://acuminous.github.io/filby/lib/schema.json
- operation: ADD_CHANGE_SET
  description: 2026 catalogue and price list
  effective: 2026-01-01T00:00:00Z
  changes:
    - entity: Model@1
      source: ./csv/catalogue-2026/model.csv
    - entity: Accessory@1
      source: ./csv/catalogue-2026/accessory.csv
    - entity: Model Grade@1
      source: ./csv/catalogue-2026/model-grade.csv
    - entity: Price@1
      source: ./csv/catalogue-2026/price.csv
    - entity: Park Model@1
      source: ./csv/catalogue-2026/park-model.csv
