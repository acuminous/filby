- operation: ADD_CHANGE_SET
  description: Rename Richmond to Skegness
  effective: 2021-06-01T00:00:00Z
  changes:
    - entity: park@1
      action: DELETE
      data:
        - code: RI

    - entity: park@1
      action: SET
      data:
        - code: SK
          name: Skegness

    - entity: season@1
      source: ./csv/season-2021-skegness.csv
