# yaml-language-server: $schema=https://acuminous.github.io/filby/lib/schema.json
- operation: ADD_ENUM
  name: season_type
  values:
    - Owners
    - Guests

- operation: ADD_ENTITY
  name: park
  fields:
    code: TEXT
    name: TEXT
  key:
    - code
  checks:
    park_code_len: (LENGTH(code) >= 2)

- operation: ADD_ENTITY
  name: season
  fields:
    park_code: TEXT
    type: season_type
    start: TIMESTAMP WITH TIME ZONE
    end: TIMESTAMP WITH TIME ZONE
  key:
    - park_code
    - type
    - start

- operation: ADD_HOOK
  name: httpbin/add-projection
  event: ADD_PROJECTION

- operation: ADD_PROJECTION
  name: park
  root: park@1
  parameters:
    code:
      field: code
  nest:
    seasons:
      entity: season@1
      on:
        park_code: code
      order:
        - field: start
          direction: DESC
        - field: type

- operation: ADD_HOOK
  name: httpbin/add-change-set/park-v1
  event: ADD_CHANGE_SET
  projection: park@1

- operation: ADD_HOOK
  name: httpbin/add-change-set/*
  event: ADD_CHANGE_SET
