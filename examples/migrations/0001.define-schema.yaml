# yaml-language-server: $schema=https://acuminous.github.io/filby/lib/schema.json
- operation: ADD_ENUM
  name: Park Region
  values:
    - Scotland
    - North East
    - Yorkshire
    - North West
    - Wales
    - Midlands
    - East
    - South East
    - South West

- operation: ADD_ENUM
  name: Customer Type
  values:
    - Guest
    - Owner

- operation: ADD_ENUM
  name: Amenity Category
  values:
    - Pool
    - Entertainment
    - Sport
    - Food
    - Nature

- operation: ADD_ENUM
  name: Age Group
  values:
    - All Ages
    - Children
    - Adults

- operation: ADD_ENUM
  name: Charge
  values:
    - Free
    - Paid

- operation: ADD_ENUM
  name: Beach Surface
  values:
    - Sandy
    - Shingle
    - Pebbles
    - Rocky

- operation: ADD_ENUM
  name: Route Accessibility
  values:
    - Step Free
    - Steps
    - Steep Steps

- operation: ADD_ENUM
  name: Grade Code
  values:
    - Platinum
    - Gold
    - Silver
    - Bronze
    - Saver

- operation: ADD_ENUM
  name: Attribute
  values:
    - Double Glazing
    - Central Heating
    - Decking
    - Dishwasher
    - En Suite
    - Patio Doors
    - Integrated Appliances

- operation: ADD_ENUM
  name: Heating
  values:
    - Gas
    - Electric
    - None

- operation: ADD_ENUM
  name: VAT Code
  values:
    - Standard
    - Holiday Caravan
    - Residential Caravan
    - Family Attraction

- operation: ADD_ENTITY
  name: Park
  fields:
    Code: TEXT
    Name:
      type: TEXT
      nullable: false
    Address:
      type: TEXT
      nullable: false
    Town:
      type: TEXT
      nullable: false
    County:
      type: TEXT
      nullable: false
    Postcode:
      type: TEXT
      nullable: false
    Region:
      type: Park Region
      nullable: false
  key:
    - Code
  checks:
    park_code_len: (LENGTH(code) = 2)

- operation: ADD_ENTITY
  name: Amenity
  fields:
    Code: TEXT
    Name:
      type: TEXT
      nullable: false
    Category:
      type: Amenity Category
      nullable: false
    Age Group:
      type: Age Group
      nullable: false
    Charge:
      type: Charge
      nullable: false
    VAT Code:
      type: VAT Code
      nullable: false
  key:
    - Code

- operation: ADD_ENTITY
  name: Park Amenity
  fields:
    Park Code: TEXT
    Amenity Code: TEXT
  key:
    - Park Code
    - Amenity Code

- operation: ADD_ENTITY
  name: Beach
  fields:
    Code: TEXT
    Name:
      type: TEXT
      nullable: false
    Surfaces:
      type: Beach Surface[]
      nullable: false
  key:
    - Code

- operation: ADD_ENTITY
  name: Beach Route
  fields:
    Park Code: TEXT
    Beach Code: TEXT
    Name: TEXT
    Distance Metres:
      type: INTEGER
      nullable: false
    Accessibility:
      type: Route Accessibility
      nullable: false
  key:
    - Park Code
    - Beach Code
    - Name

- operation: ADD_ENTITY
  name: Park Season
  fields:
    Park Code: TEXT
    Customer Type: Customer Type
    Current Season Start:
      type: DATE
      nullable: false
    Current Season End:
      type: DATE
      nullable: false
    Next Season Start: DATE
    Next Season End: DATE
  key:
    - Park Code
    - Customer Type
  checks:
    park_season_current_order: (current_season_start < current_season_end)
    park_season_next_order: (next_season_start IS NULL OR next_season_start < next_season_end)

- operation: ADD_ENTITY
  name: Park Offer
  fields:
    Park Code: TEXT
    Grade Code: Grade Code
    Discount Percent:
      type: NUMERIC(5,2)
      nullable: false
  key:
    - Park Code
    - Grade Code

- operation: ADD_ENTITY
  name: Park Model
  fields:
    Park Code: TEXT
    Model Code: TEXT
  key:
    - Park Code
    - Model Code

- operation: ADD_ENTITY
  name: Manufacturer
  fields:
    Code: TEXT
    Name:
      type: TEXT
      nullable: false
  key:
    - Code

- operation: ADD_ENTITY
  name: Model
  fields:
    Code: TEXT
    Manufacturer Code:
      type: TEXT
      nullable: false
    Name:
      type: TEXT
      nullable: false
    Berths:
      type: INTEGER
      nullable: false
    Bedrooms:
      type: INTEGER
      nullable: false
    Length:
      type: NUMERIC(4,1)
      nullable: false
    Width:
      type: NUMERIC(4,1)
      nullable: false
    Heating:
      type: Heating
      nullable: false
    Double Glazed:
      type: BOOLEAN
      nullable: false
    VAT Code:
      type: VAT Code
      nullable: false
  key:
    - Code

- operation: ADD_ENTITY
  name: Accessory
  fields:
    Code: TEXT
    Model Code:
      type: TEXT
      nullable: false
    Name:
      type: TEXT
      nullable: false
    Price:
      type: NUMERIC(10,2)
      nullable: false
  key:
    - Code

- operation: ADD_ENTITY
  name: Grade
  fields:
    Code: Grade Code
  key:
    - Code

- operation: ADD_ENTITY
  name: Grade Attribute
  fields:
    Grade Code: Grade Code
    Attribute: Attribute
  key:
    - Grade Code
    - Attribute

- operation: ADD_ENTITY
  name: Grade Model
  fields:
    Grade Code:
      type: Grade Code
      nullable: false
    Model Code: TEXT
    Year: INTEGER
  key:
    - Model Code
    - Year

- operation: ADD_ENTITY
  name: Price
  fields:
    Model Code: TEXT
    Year: INTEGER
    List Price:
      type: NUMERIC(10,2)
      nullable: false
  key:
    - Model Code
    - Year

- operation: ADD_ENTITY
  name: VAT Rate
  fields:
    Code: VAT Code
    Name:
      type: TEXT
      nullable: false
    Rate:
      type: NUMERIC(5,2)
      nullable: false
  key:
    - Code

- operation: ADD_PROJECTION
  name: Amenities
  description: The amenities a park can offer, with their category, age group, charge and VAT code
  root: Amenity@1
  parameters:
    code:
      field: Code
    category:
      field: Category
      match: in
  order:
    - field: Name

- operation: ADD_PROJECTION
  name: Beaches
  description: The beaches the parks reach, with their surfaces
  root: Beach@1
  parameters:
    code:
      field: Code
  order:
    - field: Name

- operation: ADD_PROJECTION
  name: Parks (Minimal)
  description: Parks alone, for a list or a picker
  root: Park@1
  parameters:
    code:
      field: Code
    name:
      field: Name
      match: prefix
    region:
      field: Region
      match: in
  order:
    - field: Name
  paging:
    page_size: 10
    page_max: 50

- operation: ADD_PROJECTION
  name: Parks (Detailed)
  description: Parks with their amenities and beach routes in full, seasons, offers and the models they sell
  root: Park@1
  parameters:
    code:
      field: Code
    name:
      field: Name
      match: prefix
    region:
      field: Region
      match: in
  order:
    - field: Name
  paging:
    page_size: 10
    page_max: 50
  nest:
    Amenities:
      entity: Park Amenity@1
      on:
        Park Code: Code
      fields: []
      order:
        - field: Amenity Code
      lookup:
        Amenity:
          entity: Amenity@1
          on:
            Code: Amenity Code
          fields:
            - Code
            - Name
            - Category
            - Age Group
            - Charge
            - VAT Code
    Beach Routes:
      entity: Beach Route@1
      on:
        Park Code: Code
      fields:
        - Name
        - Distance Metres
        - Accessibility
      order:
        - field: Beach Code
        - field: Name
      lookup:
        Beach:
          entity: Beach@1
          on:
            Code: Beach Code
          fields:
            - Code
            - Name
            - Surfaces
    Seasons:
      entity: Park Season@1
      on:
        Park Code: Code
      order:
        - field: Customer Type
    Offers:
      entity: Park Offer@1
      on:
        Park Code: Code
      order:
        - field: Grade Code
    Models:
      entity: Park Model@1
      on:
        Park Code: Code
      order:
        - field: Model Code
      lookup:
        Model:
          entity: Model@1
          on:
            Code: Model Code
          fields:
            - Name

- operation: ADD_PROJECTION
  name: Catalogue
  description: The whole product range, from manufacturer to model to each model's prices and accessories
  root: Manufacturer@1
  parameters:
    code:
      field: Code
  order:
    - field: Name
  nest:
    Models:
      entity: Model@1
      on:
        Manufacturer Code: Code
      order:
        - field: Name
      nest:
        Prices:
          entity: Price@1
          on:
            Model Code: Code
          order:
            - field: Year
        Accessories:
          entity: Accessory@1
          on:
            Model Code: Code
          order:
            - field: Name

- operation: ADD_PROJECTION
  name: Models
  description: Models with their list prices and accessories, for a search page
  root: Model@1
  parameters:
    code:
      field: Code
    name:
      field: Name
      match: prefix
    manufacturer:
      field: Manufacturer Code
    bedrooms:
      field: Bedrooms
    berths:
      field: Berths
      match: range
    heating:
      field: Heating
      match: in
  order:
    - field: Manufacturer Code
    - field: Name
  paging:
    page_size: 10
    page_max: 100
  nest:
    Prices:
      entity: Price@1
      on:
        Model Code: Code
      order:
        - field: Year
    Accessories:
      entity: Accessory@1
      on:
        Model Code: Code
      order:
        - field: Name
  lookup:
    Manufacturer:
      entity: Manufacturer@1
      on:
        Code: Manufacturer Code
      fields:
        - Name

- operation: ADD_PROJECTION
  name: Grades
  description: The grades a model can hold, with the attributes each grade requires and the models that hold it each year
  root: Grade@1
  parameters:
    code:
      field: Code
  order:
    - field: Code
  nest:
    Models:
      entity: Grade Model@1
      on:
        Grade Code: Code
      order:
        - field: Model Code
        - field: Year
      lookup:
        Model:
          entity: Model@1
          on:
            Code: Model Code
          fields:
            - Name
    Attributes:
      entity: Grade Attribute@1
      on:
        Grade Code: Code
      order:
        - field: Attribute

- operation: ADD_PROJECTION
  name: VAT Rates
  description: The VAT rates that apply to models and amenities
  root: VAT Rate@1
  order:
    - field: Code

- operation: ADD_HOOK
  name: httpbin/add-projection
  event: ADD_PROJECTION

- operation: ADD_HOOK
  name: httpbin/add-change-set/parks-minimal-v1
  event: ADD_CHANGE_SET
  projection: Parks (Minimal)@1

- operation: ADD_HOOK
  name: httpbin/add-change-set/*
  event: ADD_CHANGE_SET
