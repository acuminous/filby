services:
  fby_test:
    image: postgres:16-alpine
    container_name: fby_test
    environment:
      POSTGRES_DB: fby_test
      POSTGRES_USER: fby_test
      POSTGRES_PASSWORD: fby_test
    ports:
      - "5432:5432"
    healthcheck:
      test: pg_isready -h 127.0.0.1 -U fby_test
      interval: 1s
      retries: 30

  fby_example:
    image: postgres:16-alpine
    container_name: fby_example
    environment:
      POSTGRES_DB: fby_example
      POSTGRES_USER: fby_example
      POSTGRES_PASSWORD: fby_example
    ports:
      - "5433:5432"
    healthcheck:
      test: pg_isready -h 127.0.0.1 -U fby_example
      interval: 1s
      retries: 30